name: Magic Classic read tests

on:
  pull_request:
    paths:
      - "software/script/magic_classic*.py"
      - "software/script/chameleon_cmd.py"
      - "software/script/chameleon_cli_unit.py"
      - "software/script/chameleon_com.py"
      - "software/script/tests/test_magic_classic*.py"
      - "software/script/requirements.txt"
      - ".github/workflows/magic-classic-read-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing CLI dependencies
        run: python -m pip install -r software/script/requirements.txt
      - name: Test read-only backdoor and complete backups
        working-directory: software/script
        run: python -m unittest discover -s tests -p "test_magic_classic*.py" -v
      - name: Check noninteractive CLI help
        run: python software/script/chameleon_cli_main.py --help
