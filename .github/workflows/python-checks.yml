name: Lint (pyrefly + ruff)

on:
  pull_request:
    paths:
      - "software/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-formatting:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: software

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            software/pyproject.toml
            software/uv.lock
            software/script/requirements.txt

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies with uv (if lockfile present)
        if: ${{ hashFiles('software/uv.lock') != '' }}
        run: uv sync --dev

      - name: Install tools with pip (fallback)
        if: ${{ hashFiles('software/uv.lock') == '' }}
        run: |
          python -m pip install --upgrade pip
          # Try project requirements if present
          if [ -f script/requirements.txt ]; then pip install -r script/requirements.txt || true; fi
          # Ensure ruff is available
          pip install ruff

      - name: Ruff check
        run: |
          set -e
          (uv run ruff --version && uv run ruff check .) || ruff check .

  lint-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: software

    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            software/pyproject.toml
            software/uv.lock
            software/script/requirements.txt

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies with uv (if lockfile present)
        if: ${{ hashFiles('software/uv.lock') != '' }}
        run: uv sync --dev

      - name: Install tools with pip (fallback)
        if: ${{ hashFiles('software/uv.lock') == '' }}
        run: |
          python -m pip install --upgrade pip
          # Try project requirements if present
          if [ -f script/requirements.txt ]; then pip install -r script/requirements.txt || true; fi
          # Ensure pyrefly is available
          pip install pyrefly

      - name: Pyrefly check
        run: |
          set -e
          (uv run pyrefly --help >/dev/null 2>&1 && uv run pyrefly check) || pyrefly check
