name: T55xx read host tests

on:
  pull_request:
    paths:
      - "firmware/application/src/rfid/reader/lf/lf_t55xx_read*"
      - "firmware/application/src/rfid/reader/lf/lf_125khz_radio*"
      - "firmware/application/src/ble_main.*"
      - "firmware/application/src/app_cmd.c"
      - "firmware/application/src/data_cmd.h"
      - "firmware/application/tests/**"
      - "software/script/t55xx_read.py"
      - "software/script/chameleon_cmd.py"
      - "software/script/chameleon_cli_unit.py"
      - "software/script/chameleon_enum.py"
      - "software/script/tests/test_t55xx*"
      - ".github/workflows/t55xx-read-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquisition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Exercise production acquisition and RF timing
        run: python3 firmware/application/tests/run_t55xx_read_tests.py

  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing CLI dependencies
        run: python -m pip install -r software/script/requirements.txt
      - name: Test decoder, capture requests and backups
        working-directory: software/script
        run: python -m unittest discover -s tests -p "test_t55xx*.py" -v
      - name: Check noninteractive CLI help
        run: python software/script/chameleon_cli_main.py --help
