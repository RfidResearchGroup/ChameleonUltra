name: Slot profile tests

on:
  pull_request:
    paths:
      - "software/script/slot_profile*.py"
      - "software/script/chameleon_cli_unit.py"
      - "software/script/chameleon_com.py"
      - "software/script/chameleon_enum.py"
      - "software/script/tests/test_slot_profile*.py"
      - "software/script/tests/slot_profile_fixtures.py"
      - "software/script/requirements.txt"
      - ".github/workflows/slot-profile-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing CLI requirements
        run: python -m pip install -r software/script/requirements.txt
      - name: Test profile import and target recovery
        working-directory: software/script
        run: python -m unittest discover -s tests -p "test_slot_profile*.py" -v
      - name: Check CLI entrypoint
        working-directory: software/script
        run: |
          python chameleon_cli_main.py --help
          python -c "from tests.test_cli_entrypoint import test_help_exits_without_starting_interactive_prompt as a, test_non_interactive_without_command_fails_cleanly as b; a(); b()"
