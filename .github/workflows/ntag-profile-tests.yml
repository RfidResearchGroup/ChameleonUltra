name: NTAG profile tests
on:
  push:
    paths:
      - "software/script/ntag_profile*.py"
      - "software/script/chameleon_cli_unit.py"
      - "software/script/tests/*ntag_profile*.py"
      - "firmware/application/src/mfu_profile_wire.h"
      - "firmware/application/tests/test_mfu_profile_wire.c"
      - ".github/workflows/ntag-profile-tests.yml"
  pull_request:
    paths:
      - "software/script/ntag_profile*.py"
      - "software/script/chameleon_cli_unit.py"
      - "software/script/tests/*ntag_profile*.py"
      - "firmware/application/src/app_cmd.c"
      - "firmware/application/src/mfu_profile_wire.h"
      - "firmware/application/tests/test_mfu_profile_wire.c"
      - ".github/workflows/ntag-profile-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    # Python 3.9 has hosted builds for 24.04, but not the new 26.04 latest image.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r software/script/requirements.txt
      - name: Test complete profile transactions
        working-directory: software/script
        run: |
          python -m unittest discover -s tests -p "test_ntag_profile*.py" -v
          python chameleon_cli_main.py --help
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test bounded profile writer
        env:
          CC: ${{ matrix.compiler }}
        run: |
          "$CC" -std=c11 -Wall -Wextra -Werror -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I firmware/application/src \
            firmware/application/tests/test_mfu_profile_wire.c \
            -o "$RUNNER_TEMP/test_mfu_profile_wire"
          "$RUNNER_TEMP/test_mfu_profile_wire"
